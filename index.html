<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <script type="module" src="./js/main.js"></script>
    <title>Dashboard</title>
</head>
<body>
    <main>
        <aside class="sidebar">
            <button class="sidebar-toggle">≡</button>
            <div class="period-section">
                <h3>Period</h3>
                <select class="year-select">
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                </select>
                <select class="month-select">
                    <option value="0">January</option>
                    <option value="1">February</option>
                    <option value="2">March</option>
                    <option value="3">April</option>
                    <option value="4">May</option>
                    <option value="5">June</option>
                    <option value="6">July</option>
                    <option value="7">August</option>
                    <option value="8">September</option>
                    <option value="9">October</option>
                    <option value="10">November</option>
                    <option value="11">December</option>
                </select>
            </div>
            <div class="sidebar-divider"></div>
            <nav class="sidebar-nav">
                <a href="" id="projects" class="nav-item active">Projects</a>
                <a href="" id="employees" class="nav-item">Employees</a>
            </nav>
        </aside>
        <div class="content-wrapper">
            <div class="projects-content">
                <div class="header">
                    <h1>Projects</h1>
                    <button id="add-project">+ Add Project</button>
                    <button id="seed-data">Seed Data</button>
                </div>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Company name<span class="sorting-icon">⥯</span><span class="search-icon">⌕</span></th>
                            <th>Project name<span class="sorting-icon">⥯</span><span class="search-icon">⌕</span></th>
                            <th>Budget<span class="sorting-icon">⥯</span></th>
                            <th>Employee Capacity<span class="sorting-icon">⥯</span></th>
                            <th>Employees</th>
                            <th>Estimated income<span class="sorting-icon">⥯</span></th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>TechCorp</td>
                            <td>E-Commerce Platform</td>
                            <td>$12500.00</td>
                            <td>3.0/3</td>
                            <td><button class="show-employees-button">Show employees</button></td>
                            <td class="negative-income">$-3958.33</td>
                            <td><button class="project-delete-button">Delete</button></td>
                        </tr>
                    </tbody>
                </table>
                <div class="total">Total Estimated Income: <span class="total negative-income">$-16240.83</span> <span class="total-note">(Bench payments: $8700.00)</span></div>
            </div>
            <div class="employees hidden"></div>
        </div>
    </main>
</body>
</html>
